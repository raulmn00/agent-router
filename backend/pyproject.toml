[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "FastAPI service that exposes the router → dispatch pipeline."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "pydantic==2.*",
    "python-dotenv==1.*",
    # Sibling packages — installed via `pip install -e ../router ../agents` in dev,
    # and via COPY in the Dockerfile for production.
    "router",
    "agents",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "httpx==0.27.*",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]
