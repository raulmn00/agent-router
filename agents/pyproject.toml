[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agents"
version = "0.1.0"
description = "Multi-agent orchestration (Planner / Executor / Critic) over a pluggable LLMProvider."
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=2.0,<3",
    "anthropic>=0.80,<1",
    "python-dotenv==1.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*"]
exclude = ["tests*"]
